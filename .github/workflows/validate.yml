name: Validate recipes

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install the pinned Dagu release
        shell: bash
        run: |
          set -euo pipefail
          version="v$(tr -d '[:space:]' < .dagu-version)"
          install_dir="$RUNNER_TEMP/dagu-bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/install-dagu.sh" \
            "https://raw.githubusercontent.com/dagucloud/dagu/${version}/scripts/installer.sh"
          bash "$RUNNER_TEMP/install-dagu.sh" \
            --version "$version" \
            --install-dir "$install_dir" \
            --service no \
            --open-browser no \
            --no-prompt
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: npm run check
      - name: Validate Dagu workflows
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r workflow; do
            dagu validate "$workflow"
          done < <(find recipes -mindepth 2 -maxdepth 2 -name workflow.yaml -type f | sort)
